{% extends 'base/base.html' %}

{% block title %}
Add Job
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Add New Job</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    class="btn btn-success">

                    Save Job

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
